[package]
name = "openleadr-client"
description = "OpenADR 3.1 client"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["web-programming"]

[[example]]
name = "discover_vtns"
required-features = ["mdns"]

[dependencies]
openleadr-wire.workspace = true

serde.workspace = true
serde_json.workspace = true

reqwest.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true

url.workspace = true
chrono.workspace = true
rangemap.workspace = true
uuid.workspace = true
async-trait.workspace = true

mdns-sd = { workspace = true, optional = true }

[features]
default = ["rustls"]
mdns = ["dep:mdns-sd"]
# TLS for VTN requests: rustls with its default crypto provider, or rustls
# with none, for applications that install their own (for example ring).
rustls = ["reqwest/rustls"]
rustls-no-provider = ["reqwest/rustls-no-provider"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
axum.workspace = true
tracing-subscriber.workspace = true
http-body-util.workspace = true
tower.workspace = true
openleadr-vtn = { path = "../openleadr-vtn" }
tokio-test.workspace = true
sqlx.workspace = true
serial_test.workspace = true
dotenvy.workspace = true

[package.metadata.cargo-udeps.ignore]
# tokio-test is only used in the doc-tests and can therefore not be detected by cargo-udeps
development = ["tokio-test"]
